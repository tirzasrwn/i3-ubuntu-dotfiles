set -ga terminal-overrides ",tmux-256color*:Tc"
set-option -g default-terminal "tmux-256color"
set-option -g prefix C-b
bind-key C-b send-prefix
set -g base-index 1
set -g status-position bottom
set-option -sg escape-time 10
bind r source-file ~/.config/tmux/tmux.conf

set-option -g default-shell '/usr/bin/zsh'
set-window-option -g mode-keys vi
set-window-option -g mouse on

# Bind 'x' to kill the current window with confirmation
bind x confirm-before -p "kill-window #W? (y/n)" kill-window
# Bind 'X' to kill the current session with confirmation
bind X confirm-before -p "kill-session #S? (y/n)" kill-session

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set -g status-left-length 20
set -g status-right-length 30
set-option -g status-left " [#{session_name}] "
set-option -g status-right " #{pane_title} "
source-file ~/.config/tmux/colors.conf

# No -r on these: repeat-time would keep the prefix table active and eat
# the first keys typed into the picker/popup as prefix shortcuts.
bind-key f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key N run-shell "~/.local/bin/open-note"
bind-key o run-shell "tmux neww ~/.local/bin/tmux-cht.sh"

bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind a display-popup -E -w 90% -h 90% -d "#{pane_current_path}" opencode
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazydocker
bind b display-popup -E -w 90% -h 90% -d "#{pane_current_path}" 'top -d 1'

bind D neww -c "#{pane_current_path}" "[[ -e todo.md ]] && nvim todo.md || nvim ~/todo.md"

bind-key H run-shell "~/.local/bin/tmux-sessionizer ~/personal"
bind-key J run-shell "~/.local/bin/tmux-sessionizer ~/work"
bind-key K run-shell "~/.local/bin/tmux-sessionizer ~/Downloads"
bind-key L run-shell "~/.local/bin/tmux-sessionizer ~/Pictures"
