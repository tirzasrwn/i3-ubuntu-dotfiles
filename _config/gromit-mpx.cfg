# HOTKEY = "F9";
# UNDOKEY = "F8";

"small Pen" = PEN (size=5 color="purple");				
"medium Pen" = PEN (size=25 color="purple");				
"big Pen" = PEN (size=75 color="purple");				
"green Marker" = PEN (size=6 color="green" arrowsize=1);		
									
"Eraser" = ERASER (size = 75);					
									
"default" = "small Pen";						
